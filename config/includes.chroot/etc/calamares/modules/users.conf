---
defaultGroups: [ adm, cdrom, sudo, dip, plugdev, lpadmin ]
autologinGroup: autologin
sudoersGroup: sudo
setRootPassword: false
doReusePassword: false
doAutologin: false
passwordRequirements:
  minLength: 1
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
  shell: /bin/bash
hostname:
  location: EtcFile
  writeHostsFile: true
