---
modules-search: [ local ]

instances:
- id: mode
  module: packagechooser
  config: packagechooser-mode.conf
- id: apps
  module: packagechooser
  config: packagechooser-apps.conf
- id: postinstall
  module: shellprocess
  config: shellprocess-postinstall.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - packagechooser@mode
  - packagechooser@apps
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - initramfscfg
  - initramfs
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - packages
  - shellprocess@postinstall
  - bootloader
  - umount
- show:
  - finished

branding: radiantos
prompt-install: true
dont-chroot: false
